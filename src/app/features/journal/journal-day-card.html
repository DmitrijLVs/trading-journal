<div class="card tj-card" [class.expanded]="expanded()">
  <!-- Шапка дня: раскрывает сделки; снимок — отдельной кнопкой -->
  <div class="head">
    <button type="button" class="toggle" [attr.aria-expanded]="expanded()" (click)="expanded.set(!expanded())">
      <span class="date">
        <span class="title">{{ title() }}</span>
        <span class="meta">
          <span>{{ day().trades.length }} сд. · винрейт {{ winRate().toFixed(0) }}% · комиссии {{ fees() }}</span>
          @if (mistakes(); as list) {
            <span class="mistakes">{{ list }}</span>
          }
        </span>
      </span>

      @if (day().curve.length > 2) {
        <app-spark-line class="spark" [data]="day().curve" [w]="120" [h]="28" />
      }
      <app-pnl class="pnl" [value]="day().pnl" />
      <app-icon class="chevron" [name]="expanded() ? 'chevron-up' : 'chevron-down'" style="--icon-size: 15px" />
    </button>
    <button
      app-button
      class="snap"
      variant="ghost"
      size="sm"
      [iconOnly]="true"
      appTooltip="Снимок дня"
      aria-label="Снимок дня"
      (click)="shareSnapshot()"
    >
      <app-icon name="camera" style="--icon-size: 15px" />
    </button>
  </div>

  <!-- Сделки дня -->
  @if (expanded() && rows().length > 0) {
    <div class="trades">
      <table class="tj-table">
        <thead>
          <tr>
            <th>Закрыта</th>
            <th>Тикер</th>
            <th></th>
            <th class="num">Время</th>
            <th class="num">%</th>
            <th class="num">P&L</th>
          </tr>
        </thead>
        <tbody>
          @for (row of rows(); track row.trade.id) {
            <tr>
              <td class="muted">{{ row.time }}</td>
              <td><a class="sym" [routerLink]="['/trades', row.trade.id]">{{ row.trade.symbol }}</a></td>
              <td>
                <span class="tj-side" [class]="row.trade.side">
                  <app-icon [name]="row.trade.side" style="--icon-size: 12px" />
                  {{ row.trade.side === 'long' ? 'L' : 'S' }}
                </span>
              </td>
              <td class="num muted">{{ row.duration }}</td>
              <td class="num"><app-pnl [value]="row.pct" kind="percent" /></td>
              <td class="num"><app-pnl [value]="row.pnl" /></td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
