<div class="layout">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard">
      <img class="brand-mark" src="logo.png" alt="" width="32" height="32" />
      <span class="brand-name">ProboyScalp</span>
    </a>

    <nav class="nav">
      <div class="nav-section">
        @for (item of mainNav; track item.path) {
          <a class="nav-item" [routerLink]="item.path" routerLinkActive="is-active" #rla="routerLinkActive">
            <app-icon [name]="item.icon" />
            <span>{{ item.label }}</span>
            @if (rla.isActive) {
              <i class="nav-ink" appSketchUnderline [sketchSeed]="item.path" [sketchInset]="0"></i>
            }
          </a>
        }
      </div>

      <div class="nav-divider"></div>

      <div class="nav-section">
        @for (item of systemNav; track item.path) {
          <a class="nav-item" [routerLink]="item.path" routerLinkActive="is-active" #rla="routerLinkActive">
            <app-icon [name]="item.icon" />
            <span>{{ item.label }}</span>
            @if (rla.isActive) {
              <i class="nav-ink" appSketchUnderline [sketchSeed]="item.path" [sketchInset]="0"></i>
            }
          </a>
        }
      </div>
    </nav>

    <div class="sidebar-foot">
      <div class="user">
        <span class="user-avatar">{{ initials() }}</span>
        <span class="user-meta">
          <span class="user-name" [title]="email()">{{ email() }}</span>
        </span>
        <button type="button" class="logout" appTooltip="Выйти" aria-label="Выйти" (click)="logout()">
          <app-icon name="logout" style="--icon-size: 15px" />
        </button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <app-account-switcher />
      @if (accounts.hasAccounts()) {
        <app-session-strip class="session" />
      }
      <div class="topbar-spacer"></div>
      <button
        type="button"
        class="money-toggle"
        [class.active]="privacy.hidden()"
        [appTooltip]="privacy.hidden() ? 'Показать суммы (Shift+H)' : 'Скрыть суммы (Shift+H)'"
        [attr.aria-pressed]="privacy.hidden()"
        aria-label="Скрыть суммы"
        (click)="privacy.toggle()"
      >
        <app-icon [name]="privacy.hidden() ? 'eye-off' : 'eye'" style="--icon-size: 16px" />
      </button>
      <!-- Период анализа нужен страницам с данными, в настройках он лишний. -->
      @if (accounts.hasAccounts() && !onSettings()) {
        <app-period-picker />
      }
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>

<app-toast-outlet />
