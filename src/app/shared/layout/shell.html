<div class="layout">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard">
      <span class="brand-mark">
        <app-icon name="trades" style="--icon-size: 17px" />
      </span>
      <span class="brand-name">TradeLog</span>
    </a>

    <nav class="nav">
      <div class="nav-section">
        @for (item of mainNav; track item.path) {
          <a class="nav-item" [routerLink]="item.path" routerLinkActive="is-active">
            <app-icon [name]="item.icon" />
            <span>{{ item.label }}</span>
          </a>
        }
      </div>

      <div class="nav-divider"></div>

      <div class="nav-section">
        @for (item of systemNav; track item.path) {
          <a class="nav-item" [routerLink]="item.path" routerLinkActive="is-active">
            <app-icon [name]="item.icon" />
            <span>{{ item.label }}</span>
          </a>
        }
      </div>
    </nav>

    <div class="sidebar-foot">
      <div class="user">
        <span class="user-avatar">ДК</span>
        <span class="user-meta">
          <span class="user-name">Дмитрий</span>
          <span class="user-plan">Pro · демо-данные</span>
        </span>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <app-account-switcher />
      <div class="topbar-spacer"></div>
      <app-period-picker />
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>

<app-toast-outlet />
